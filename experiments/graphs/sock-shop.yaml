# Call graph for Weaveworks' Sock Shop, the system behind RCAEval RE1-SS and
# RE2-SS. Edge direction is caller -> callee, as docs/06 section 2 requires.
#
# THIS FILE IS ON THE "THINGS THE HUMAN MUST CHECK BY HAND" LIST IN PROGRESS.md,
# and it needs the check more than the Online Boutique one does, for two reasons
# stated plainly here:
#
#   1. When this file was written RE1-SS had not been downloaded. It has now
#      (M3.2) and every service name below matches the data exactly - see
#      `checked_against_data` under `origin`. What the data cannot check is
#      whether each edge is real, which is what point 2 is about.
#   2. Sock Shop does not declare its dependencies in its Kubernetes manifests the
#      way Online Boutique does. Each service hard-codes its callees' DNS names in
#      its own source, so every edge below was read out of a specific source file
#      and carries that file as its evidence. No edge comes from the architecture
#      diagram, which is a PNG.

system: sock-shop
source: STATIC_ARCHITECTURE

origin:
  repository: https://github.com/microservices-demo
  version: master
  retrieved: 2026-10-05
  how: >
    The service list is the 14 Deployments in
    microservices-demo/deploy/kubernetes/complete-demo.yaml. The edges are not in
    that file: Sock Shop services find each other by hard-coded DNS name, so each
    edge was taken from the source file that contains the name, recorded per edge
    below. `master` rather than a tag because the project is archived and its
    manifests have not changed in years; there is no release tag to pin.
  not_pinned_to_a_date: >
    RE1-SS was collected between 2023-08-26 and 2023-12-12 (the inject_time
    range over its 125 cases, read in M3.2). The repository was already archived
    and its manifests unchanged long before that, so `master` is what was
    running; there is no dated release to pin to instead.
  checked_against_data: >
    M3.2, 2026-10-05, all 125 RE1-SS cases (metrics from simple_data.csv). Every
    one of the 14 services named below appears in the data under exactly this
    spelling, so no renames were needed. The data has one further service,
    listed under no_edges.

# All 14 Deployments are covered by the edges below. The data adds one service
# that is not a Deployment of its own, and it is left without edges for the same
# reason as the Online Boutique telemetry entries: inventing an edge would be
# worse than leaving it out.
no_edges:
  rabbitmq-exporter: >
    The Prometheus exporter sidecar in the rabbitmq pod. It carries only cpu and
    mem. It scrapes the broker for metrics but serves no application traffic, so
    no service calls it and it calls nothing on a request path. Left isolated.

# 15 edges over 14 services.
edges:
  # front-end's backends are all declared in one file, which is as close to a
  # manifest as Sock Shop gets.
  - from: front-end
    to: catalogue
    evidence: front-end/api/endpoints.js catalogueUrl
  - from: front-end
    to: carts
    evidence: front-end/api/endpoints.js cartsUrl
  - from: front-end
    to: orders
    evidence: front-end/api/endpoints.js ordersUrl
  - from: front-end
    to: user
    evidence: >
      front-end/api/endpoints.js customersUrl, addressUrl, cardsUrl, loginUrl and
      registerUrl all point at the `user` host
  - from: front-end
    to: session-db
    evidence: >
      front-end/config.js sets session_redis.store to RedisStore({host:
      "session-db"}), and complete-demo.yaml switches it on with SESSION_REDIS=true

  # orders calls payment and shipping by hard-coded hostname...
  - from: orders
    to: payment
    evidence: orders OrdersConfigurationProperties.java getPaymentUri, Hostname("payment")
  - from: orders
    to: shipping
    evidence: orders OrdersConfigurationProperties.java getShippingUri, Hostname("shipping")
  # ...and calls user and carts by URL rather than hostname, which is easy to miss.
  # OrdersController.newOrder fetches item.address, item.customer, item.card and
  # item.items, which are URLs it receives in the request body. front-end fills
  # them in: the first three from its customersUrl (host `user`) and the fourth
  # from its cartsUrl (host `carts`). So these are real runtime calls from orders,
  # not from front-end, even though no hostname appears in the orders source.
  - from: orders
    to: user
    evidence: >
      orders OrdersController.newOrder gets item.customer / item.address /
      item.card; front-end/api/orders/index.js builds those links from
      endpoints.customersUrl
  - from: orders
    to: carts
    evidence: >
      orders OrdersController.newOrder gets item.items;
      front-end/api/orders/index.js sets it to endpoints.cartsUrl + "/<id>/items"

  # Datastores.
  - from: orders
    to: orders-db
    evidence: orders application.properties spring.data.mongodb.uri mongodb://orders-db:27017
  - from: carts
    to: carts-db
    evidence: carts application.properties spring.data.mongodb.uri mongodb://carts-db:27017
  - from: catalogue
    to: catalogue-db
    evidence: catalogue main.go DSN flag default, tcp(catalogue-db:3306)
  - from: user
    to: user-db
    evidence: complete-demo.yaml user Deployment env, value "user-db:27017"

  # The queue. shipping publishes, queue-master consumes. Both name the broker
  # directly, so both get an edge to it; there is no edge between the two, because
  # neither calls the other.
  - from: shipping
    to: rabbitmq
    evidence: shipping application.properties spring.rabbitmq.host=rabbitmq
  - from: queue-master
    to: rabbitmq
    evidence: queue-master application.properties spring.rabbitmq.host=rabbitmq
